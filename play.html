  border:2px solid #4a90d9;background:rgba(255,255,255,.95);

body.mobile #hud{font-size:11px;max-width:45%;top:56px}

#menu{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;align-items:center;justify-content:center}
#menu .mp{background:#f4f4f4;width:560px;padding:14px;border:2px solid #333;display:grid;grid-template-columns:1fr 170px;gap:8px 14px;font-size:13px;color:#111}
#menu h3{margin:0;grid-column:1/3}#menu .l{display:flex;flex-direction:column;gap:7px}#menu button{padding:7px;font-size:13px;cursor:pointer}
